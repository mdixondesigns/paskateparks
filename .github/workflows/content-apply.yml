# Apply content changesets to PRODUCTION.
#
# Runs when a merge to main touches content/changes/, then WAITS: the
# `content-production` environment requires the owner's approval. GitHub emails
# "Review pending deployments"; click Review deployments → Approve. Only then do
# the production credentials (environment secrets) unlock.
#
# Applies every changeset production hasn't had yet, in filename order, copying
# their photos from staging storage. Supabase webhooks refresh the live pages.
# Re-running is safe — applied changesets are recorded and skipped.

name: Apply content to production

on:
  push:
    branches: [main]
    paths: ["content/changes/*.json"]
  workflow_dispatch:

concurrency:
  group: content-apply-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: content-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Credentials
        env:
          STAGING_DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
        run: |
          {
            echo "DIRECT_URL=$STAGING_DIRECT_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$STAGING_SUPABASE_URL"
            echo "SUPABASE_SECRET_KEY=$STAGING_SECRET_KEY"
          } > .env.local
          {
            echo "DIRECT_URL=$PROD_DIRECT_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$PROD_SUPABASE_URL"
            echo "SUPABASE_SECRET_KEY=$PROD_SECRET_KEY"
          } > .env.production.local

      - name: What will be applied
        run: pnpm content:apply --production --dry-run

      - name: Apply
        env:
          CONTENT_APPLY_PRODUCTION: "yes"
        run: pnpm content:apply --production
