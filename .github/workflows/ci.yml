# CI — the objective gate for every PR (human- or agent-authored).
#
# Runs lint, formatting, typecheck, unit tests, and content changeset
# validation. A red check here means "not ready", regardless of what anyone
# (or any agent) says about the change.
#
# Deliberately NOT here yet:
#   • `pnpm build` / `pnpm test:e2e` — the build reads parks from Supabase at
#     build time, and the only Supabase project today is production. Vercel
#     builds every push anyway. Add these once CI can use the staging project
#     so CI never holds production credentials.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Content changesets
        run: pnpm content:check
