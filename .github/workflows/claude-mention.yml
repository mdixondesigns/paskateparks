# Ad-hoc help on pull requests: comment "@claude <request>" on a PR (or in a
# PR review) and Claude works on that PR's branch. Owner-only.
#
# Issues use claude-issue.yml (the `ai-ready` label) instead.

name: Claude on PRs

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-pr-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.event.sender.login == 'mdixondesigns' &&
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      id-token: write # Claude GitHub App auth
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model sonnet
            --max-turns 60
            --append-system-prompt "Follow CLAUDE.md. For UI work follow VISUAL-DESIGN.md. Before committing, run pnpm lint, pnpm format, pnpm typecheck and pnpm test and make them pass. Never add dependencies, edit .env files, or touch any database."
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(pnpm lint),Bash(pnpm format),Bash(pnpm format:check),Bash(pnpm typecheck),Bash(pnpm test),Bash(pnpm exec vitest:*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*)"
